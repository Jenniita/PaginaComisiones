services:
  node:
    build: ./node
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-comisiones}
      DB_USER: ${POSTGRES_USER:-comisiones}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-comisiones_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  php:
    build: ./php
    ports:
      - "${PHP_PORT:-8000}:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-comisiones}
      DB_USER: ${POSTGRES_USER:-comisiones}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-comisiones_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comisiones}
      POSTGRES_USER: ${POSTGRES_USER:-comisiones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comisiones_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgadmin_data:
